plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.virtualmax.privacy'
    compileSdk 34

    defaultConfig {
        applicationId "com.virtualmax.privacy"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.4.0"
    }

    // Подпись релизного APK.
    // Ключ и пароль — СЕКРЕТЫ, они НЕ должны лежать в git (см. SECURITY.md).
    // Пароль приходит из GitHub Secrets (KEYSTORE_PASS / KEYSTORE_ALIAS) или
    // через -PKEYSTORE_PASS=... при локальной сборке. Никаких значений по умолчанию:
    // если ключ есть, а пароля нет — сборка падает.
    signingConfigs {
        release {
            def ksFile = rootProject.file("keystore.jks")
            if (ksFile.exists()) {
                def pass = System.getenv("KEYSTORE_PASS") ?: project.findProperty("KEYSTORE_PASS")
                def alias = System.getenv("KEYSTORE_ALIAS") ?: project.findProperty("KEYSTORE_ALIAS") ?: "virtualmax"
                if (pass == null || pass.toString().isEmpty()) {
                    throw new GradleException(
                        "KEYSTORE_PASS не задан: ключ подписи найден (mobile/keystore.jks), " +
                        "но пароль не передан. Задайте KEYSTORE_PASS через переменную окружения " +
                        "или -PKEYSTORE_PASS=... (см. SECURITY.md).")
                }
                storeFile ksFile
                storePassword pass.toString()
                keyAlias alias
                keyPassword pass.toString()
                v1SigningEnabled true
                v2SigningEnabled true
                v3SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // Настоящий релизный APK без отладочного флага.
            debuggable false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // В проекте только PNG-иконки и XML — отключаем лишнюю обработку ресурсов.
    buildFeatures {
        buildConfig false
    }
}

dependencies {
    // Чистый Android SDK без сторонних зависимостей — минимальный размер APK.
}

// Исходники содержат кириллицу и эмодзи — фиксируем кодировку компиляции.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
