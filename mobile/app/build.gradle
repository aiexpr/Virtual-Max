plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.virtualmax.privacy'
    compileSdk 34

    defaultConfig {
        applicationId "com.virtualmax.privacy"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.4.0"
    }

    // Подпись релизного APK.
    // Пароли приходят из GitHub Secrets (KEYSTORE_PASS / KEYSTORE_ALIAS).
    // Для локальной сборки работают значения по умолчанию от закоммиченного keystore.jks.
    signingConfigs {
        release {
            def ksFile = rootProject.file("keystore.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASS") ?: (project.findProperty("KEYSTORE_PASS") ?: "virtualmax123")
                keyAlias System.getenv("KEYSTORE_ALIAS") ?: (project.findProperty("KEYSTORE_ALIAS") ?: "virtualmax")
                keyPassword System.getenv("KEYSTORE_PASS") ?: (project.findProperty("KEYSTORE_PASS") ?: "virtualmax123")
                v1SigningEnabled true
                v2SigningEnabled true
                v3SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // Настоящий релизный APK без отладочного флага.
            debuggable false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // В проекте только PNG-иконки и XML — отключаем лишнюю обработку ресурсов.
    buildFeatures {
        buildConfig false
    }
}

dependencies {
    // Чистый Android SDK без сторонних зависимостей — минимальный размер APK.
}

// Исходники содержат кириллицу и эмодзи — фиксируем кодировку компиляции.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
